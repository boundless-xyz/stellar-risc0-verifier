[package]
name = "soroban-risc0-groth16-verifier"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Expose `test_fixtures` to other crates' dev dependencies. Off by default
# so the data is excluded from production builds.
test-fixtures = []

[dependencies]
soroban-risc0-verifier-interface = { workspace = true }
soroban-sdk = { workspace = true }

[build-dependencies]
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
risc0-binfmt = { workspace = true }
risc0-circuit-recursion = { workspace = true }
risc0-groth16 = { workspace = true }
risc0-zkp = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
