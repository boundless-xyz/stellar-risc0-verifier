name: Gas Benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmark:
    name: Gas Consumption Benchmark
    runs-on: [ self-hosted, prod, "${{ matrix.os }}", "${{ matrix.arch }}", "${{ matrix.device }}" ]
    strategy:
      matrix:
        include:
          - os: Linux
            arch: X64
            feature: default
            device: cpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: install rust
        uses: risc0/risc0/.github/actions/rustup@main

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run gas benchmarks
        id: benchmark
        run: |
          # Run benchmarks across both verifier-bearing crates and capture output.
          # `groth16-verifier` measures the bare verifier; `emergency-stop`
          # measures a receipt routed through `RiscZeroVerifierEmergencyStop`
          # (which wraps the production groth16 verifier in its own benches).
          OUTPUT=$(cargo test --release --manifest-path contracts/groth16-verifier/Cargo.toml bench_ -- --nocapture --test-threads=1 2>&1)
          OUTPUT="$OUTPUT
          $(cargo test --release --manifest-path contracts/emergency-stop/Cargo.toml bench_ -- --nocapture --test-threads=1 2>&1)"
          echo "$OUTPUT"

          # Parse benchmark results from `Budget::print()` output.
          #
          # The tests print sections like:
          #   "========== BENCHMARK: verify() =========="
          #   "Cpu limit: ...; used: <N>"
          #   "Mem limit: ...; used: <N>"
          #
          # Extract the `used:` values for each benchmark label.
          extract_used() {
            local label="$1"
            local kind="$2" # "cpu" or "mem"
            # Match the section header by full literal substring (via awk's
            # index()) rather than regex: the existing labels include `()`
            # which is interpreted as an empty group in regex, causing
            # `verify()` to also match `verify_integrity()`'s header.
            echo "$OUTPUT" | awk -v label="$label" -v kind="$kind" '
              BEGIN { header = "========== BENCHMARK: " label " ==========" }
              index($0, header) > 0 { in_section=1; next }
              in_section && /^========== BENCHMARK:/ { in_section=0 }
              in_section && kind=="cpu" && /^Cpu limit:/ {
                line=$0
                sub(/.*used: /, "", line)
                sub(/[^0-9].*/, "", line)
                print line
                exit
              }
              in_section && kind=="mem" && /^Mem limit:/ {
                line=$0
                sub(/.*used: /, "", line)
                sub(/[^0-9].*/, "", line)
                print line
                exit
              }
            '
          }

          VERIFY_CPU=$(extract_used "verify()" "cpu")
          VERIFY_MEM=$(extract_used "verify()" "mem")
          INTEGRITY_CPU=$(extract_used "verify_integrity()" "cpu")
          INTEGRITY_MEM=$(extract_used "verify_integrity()" "mem")
          CLAIM_CPU=$(extract_used "ReceiptClaim::digest()" "cpu")
          CLAIM_MEM=$(extract_used "ReceiptClaim::digest()" "mem")
          ESTOP_VERIFY_CPU=$(extract_used "estop_verify" "cpu")
          ESTOP_VERIFY_MEM=$(extract_used "estop_verify" "mem")
          ESTOP_INTEGRITY_CPU=$(extract_used "estop_integrity" "cpu")
          ESTOP_INTEGRITY_MEM=$(extract_used "estop_integrity" "mem")

          # Format numbers with commas for readability
          format_number() {
            echo "$1" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta'
          }

          VERIFY_CPU_FMT=$(format_number "$VERIFY_CPU")
          VERIFY_MEM_FMT=$(format_number "$VERIFY_MEM")
          INTEGRITY_CPU_FMT=$(format_number "$INTEGRITY_CPU")
          INTEGRITY_MEM_FMT=$(format_number "$INTEGRITY_MEM")
          CLAIM_CPU_FMT=$(format_number "$CLAIM_CPU")
          CLAIM_MEM_FMT=$(format_number "$CLAIM_MEM")
          ESTOP_VERIFY_CPU_FMT=$(format_number "$ESTOP_VERIFY_CPU")
          ESTOP_VERIFY_MEM_FMT=$(format_number "$ESTOP_VERIFY_MEM")
          ESTOP_INTEGRITY_CPU_FMT=$(format_number "$ESTOP_INTEGRITY_CPU")
          ESTOP_INTEGRITY_MEM_FMT=$(format_number "$ESTOP_INTEGRITY_MEM")

          # Write to job summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ⛽ Gas Consumption Report

          | Benchmark | CPU Instructions | Memory Bytes |
          |-----------|------------------|--------------|
          | \`verify()\` | ${VERIFY_CPU_FMT:-N/A} | ${VERIFY_MEM_FMT:-N/A} |
          | \`verify_integrity()\` | ${INTEGRITY_CPU_FMT:-N/A} | ${INTEGRITY_MEM_FMT:-N/A} |
          | \`ReceiptClaim::digest()\` | ${CLAIM_CPU_FMT:-N/A} | ${CLAIM_MEM_FMT:-N/A} |
          | \`verify()\` (emergency-stop) | ${ESTOP_VERIFY_CPU_FMT:-N/A} | ${ESTOP_VERIFY_MEM_FMT:-N/A} |
          | \`verify_integrity()\` (emergency-stop) | ${ESTOP_INTEGRITY_CPU_FMT:-N/A} | ${ESTOP_INTEGRITY_MEM_FMT:-N/A} |

          > 💡 **Tip**: Lower numbers = less gas = cheaper transactions!
          EOF

          # Save raw values for PR comment
          echo "verify_cpu=$VERIFY_CPU_FMT" >> $GITHUB_OUTPUT
          echo "verify_mem=$VERIFY_MEM_FMT" >> $GITHUB_OUTPUT
          echo "integrity_cpu=$INTEGRITY_CPU_FMT" >> $GITHUB_OUTPUT
          echo "integrity_mem=$INTEGRITY_MEM_FMT" >> $GITHUB_OUTPUT
          echo "claim_cpu=$CLAIM_CPU_FMT" >> $GITHUB_OUTPUT
          echo "claim_mem=$CLAIM_MEM_FMT" >> $GITHUB_OUTPUT
          echo "estop_verify_cpu=$ESTOP_VERIFY_CPU_FMT" >> $GITHUB_OUTPUT
          echo "estop_verify_mem=$ESTOP_VERIFY_MEM_FMT" >> $GITHUB_OUTPUT
          echo "estop_integrity_cpu=$ESTOP_INTEGRITY_CPU_FMT" >> $GITHUB_OUTPUT
          echo "estop_integrity_mem=$ESTOP_INTEGRITY_MEM_FMT" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const verifyCpu = '${{ steps.benchmark.outputs.verify_cpu }}';
            const verifyMem = '${{ steps.benchmark.outputs.verify_mem }}';
            const integrityCpu = '${{ steps.benchmark.outputs.integrity_cpu }}';
            const integrityMem = '${{ steps.benchmark.outputs.integrity_mem }}';
            const claimCpu = '${{ steps.benchmark.outputs.claim_cpu }}';
            const claimMem = '${{ steps.benchmark.outputs.claim_mem }}';
            const estopVerifyCpu = '${{ steps.benchmark.outputs.estop_verify_cpu }}';
            const estopVerifyMem = '${{ steps.benchmark.outputs.estop_verify_mem }}';
            const estopIntegrityCpu = '${{ steps.benchmark.outputs.estop_integrity_cpu }}';
            const estopIntegrityMem = '${{ steps.benchmark.outputs.estop_integrity_mem }}';

            const body = `## ⛽ Gas Consumption Report

            | Benchmark | CPU Instructions | Memory Bytes |
            |-----------|------------------|--------------|
            | \`verify()\` | ${verifyCpu || 'N/A'} | ${verifyMem || 'N/A'} |
            | \`verify_integrity()\` | ${integrityCpu || 'N/A'} | ${integrityMem || 'N/A'} |
            | \`ReceiptClaim::digest()\` | ${claimCpu || 'N/A'} | ${claimMem || 'N/A'} |
            | \`verify()\` (emergency-stop) | ${estopVerifyCpu || 'N/A'} | ${estopVerifyMem || 'N/A'} |
            | \`verify_integrity()\` (emergency-stop) | ${estopIntegrityCpu || 'N/A'} | ${estopIntegrityMem || 'N/A'} |

            <details>
            <summary>📊 What do these numbers mean?</summary>

            - **CPU Instructions**: Determines transaction fees on Stellar
            - **Memory Bytes**: Determines resource limits
            - Lower is better! 🎯

            </details>
            `;

            // Find existing comment from this workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('⛽ Gas Consumption Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
