name: Build and test code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: [ self-hosted, prod, "${{ matrix.os }}", "${{ matrix.arch }}", "${{ matrix.device }}" ]
    strategy:
      matrix:
        include:
          - os: Linux
            arch: X64
            feature: default
            device: cpu
    steps:
    - uses: actions/checkout@v4
    - name: install rust
      uses: risc0/risc0/.github/actions/rustup@main
    - name: Build
      run: cargo test --workspace --verbose --no-run
    - name: Run tests
      run: cargo test --workspace --verbose
